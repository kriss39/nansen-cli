name: apply-profiler-compare-fix
on:
  push:
    branches:
      - fix/profiler-compare-api-failures
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profiler-compare-api-failures
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/cli.js')
          s = p.read_text()
          needle = '.catch(() => null)'
          assert s.count(needle) == 4, s.count(needle)
          p.write_text(s.replace(needle, ''))
          PY
          cat > src/__tests__/profiler-compare-api-failures.test.js <<'EOF'
          import { describe, expect, it, vi } from 'vitest';
          import { compareWallets } from '../cli.js';

          const A = '0x0000000000000000000000000000000000000001';
          const B = '0x0000000000000000000000000000000000000002';

          describe('profiler compare API failures', () => {
            it('propagates a counterparty request failure instead of returning empty overlap', async () => {
              const failure = new Error('rate limited');
              const api = {
                addressCounterparties: vi.fn()
                  .mockRejectedValueOnce(failure)
                  .mockResolvedValueOnce({ data: [] }),
                addressBalance: vi.fn(),
              };

              await expect(compareWallets(api, {
                addresses: [A, B],
                chain: 'ethereum',
                delayMs: 0,
              })).rejects.toBe(failure);

              expect(api.addressBalance).not.toHaveBeenCalled();
            });

            it('propagates a balance request failure instead of reporting a zero balance', async () => {
              const failure = new Error('service unavailable');
              const api = {
                addressCounterparties: vi.fn().mockResolvedValue({ data: [] }),
                addressBalance: vi.fn()
                  .mockRejectedValueOnce(failure)
                  .mockResolvedValueOnce({ data: [] }),
              };

              await expect(compareWallets(api, {
                addresses: [A, B],
                chain: 'ethereum',
                delayMs: 0,
              })).rejects.toBe(failure);
            });
          });
          EOF
          cat > .changeset/fix-profiler-compare-api-failures.md <<'EOF'
          ---
          "nansen-cli": patch
          ---

          Surface profiler compare API failures instead of turning failed counterparty or balance requests into empty overlap and zero-dollar results.
          EOF
          rm .github/workflows/_apply-profiler-compare-fix.yml
      - run: npx vitest run src/__tests__/profiler-compare-api-failures.test.js
      - run: npm run lint
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(profiler): surface compare API failures"
          git push
